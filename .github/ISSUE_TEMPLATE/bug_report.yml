name: Bug report
description: Report a reproducible problem in the engine, CLI, viewer, or analysis tools.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: For security-sensitive reports, stop and use the private process in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected behavior, and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest deterministic reproduction, including the seed when relevant.
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: The output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Node version, pnpm version, and operating system.
    validations:
      required: true
